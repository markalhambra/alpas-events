# Best-effort Free-plan keep-alive. Supabase may still pause a project that
# has only one query per day. Vercel Hobby allows one cron per day, so this
# workflow adds three more database pings, staggered away from 12:00 UTC.
# Set repo secrets: KEEP_ALIVE_URL, CRON_SECRET
# Scheduled runs also stop if the repository has no activity for 60 days.
name: Supabase keep-alive

on:
  schedule:
    # 01:15, 09:15, and 17:15 UTC — a few requests each day.
    - cron: "15 1,9,17 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${KEEP_ALIVE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Set KEEP_ALIVE_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "${KEEP_ALIVE_URL}"
